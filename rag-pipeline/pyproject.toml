[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Hybrid + agentic RAG pipeline for legal corpora"
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"