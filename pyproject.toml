[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local_rag_app"
version = "0.1.0"
description = "Python-native local-first RAG application with chat UI and OpenAI-compatible config"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.0.0",
  "python-multipart",
  "jinja2",
  "sqlmodel",
  "aiosqlite",
  "langchain",
  "langchain-community",
  "chromadb",
  "openai>=1.0.0",
  "pypdf",
  "python-docx",
  "markdown",
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pytest",
]

[tool.setuptools]
packages = ["backend", "frontend"]
