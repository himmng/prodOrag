[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────
# Project metadata
# ─────────────────────────────────────────────────────────────────────

[project]
name            = "rag-pipeline"
version         = "0.1.0"
description     = "Hybrid + agentic RAG pipeline for legal corpora (IPC)"
readme          = "README.md"
requires-python = ">=3.12"
license         = { text = "MIT" }
authors         = [{ name = "Himanshu Tiwari" }]
keywords        = ["rag", "retrieval-augmented-generation", "llm", "legal-nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies — these are what `pip install -e .` pulls.
# Pin minimums, not maximums, so deps can be upgraded freely.
dependencies = [
    # Web service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",

    # Config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "transformers>=4.45",

    # LangChain stack
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",

    # Retrieval
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.3",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3",

    # Parsing
    "docling>=2,<2.92",  # DocumentConverter API removed in 2.92 (see parsers/docling.py)
    "pdfplumber>=0.11",   # concordance table parsing + PDF page-image preview

    # Data
    "pandas>=2.2",
    "openpyxl>=3.1",      # if you use pd.read_excel anywhere

    # Dashboard
    "streamlit>=1.30",

]

# ─────────────────────────────────────────────────────────────────────
# Optional extras
# Install with: pip install -e ".[dev]"  or  pip install -e ".[cloud]"
# ─────────────────────────────────────────────────────────────────────

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",          # FastAPI TestClient backend
]

# Phase 6 — cloud providers (add as you adopt them)
cloud = [
    "langchain-openai>=0.2",
    "langchain-aws>=0.2",
    "langchain-google-vertexai>=2.0",
]

# Docs site: `mkdocs serve` / `mkdocs build` (see mkdocs.yml)
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

# Eval/research-only deps (RAGAS A/B notebooks)
eval = [
    "ragas>=0.2",
    "datasets>=3.0",
    "matplotlib",          # eval/plot_results.py
    # ragas 0.4.x unconditionally imports langchain_community.chat_models.vertexai,
    # which langchain-community dropped in 0.4.2 — cap until ragas fixes this upstream.
    "langchain-community<0.4.2",
]

[project.urls]
Repository = "https://github.com/himmng/prodOrag"
Issues     = "https://github.com/himmng/prodOrag/issues"

[project.scripts]
rag-ingest = "rag_pipeline.cli.ingest:main"

# ─────────────────────────────────────────────────────────────────────
# Packaging
# ─────────────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Include YAML templates and data files alongside the Python code so they
# ship with the installed package (matters for prompts/templates/ and
# eval/data/).
[tool.setuptools.package-data]
"rag_pipeline" = [
    "prompts/templates/*.yaml",
    "eval/data/*.yaml",
]

# ─────────────────────────────────────────────────────────────────────
# Testing
# ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths   = ["tests"]
pythonpath  = ["src"]
addopts     = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow:        marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that hit the live API (require Ollama)",
    
]

# ─────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source   = ["src/rag_pipeline"]
branch   = true
omit     = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing  = true
skip_covered  = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]