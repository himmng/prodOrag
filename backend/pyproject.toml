[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]",
    "aiosqlite",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
