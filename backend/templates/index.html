<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>protoRAG</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <h1 class="app-title">protoRAG</h1>
        <button id="new-chat-btn">New Chat</button>
        <div class="sidebar-section">
          <h2>Documents</h2>
          <input type="file" id="file-input" />
          <button id="upload-btn">Upload</button>
        </div>
        <div class="sidebar-section">
          <h2>Settings</h2>
          <form id="config-form">
            <fieldset>
              <legend>LLM</legend>
              <label>Provider <input name="llm.provider" /></label>
              <label>Base URL <input name="llm.base_url" /></label>
              <label>Model <input name="llm.model" /></label>
            </fieldset>
            <fieldset>
              <legend>Embeddings</legend>
              <label>Provider <input name="embeddings.provider" /></label>
              <label>Base URL <input name="embeddings.base_url" /></label>
              <label>Model <input name="embeddings.model" /></label>
            </fieldset>
            <fieldset>
              <legend>Storage</legend>
              <label>Vector dir <input name="storage.vector_dir" /></label>
              <label>Docs dir <input name="storage.docs_dir" /></label>
            </fieldset>
            <fieldset>
              <legend>RAG</legend>
              <label>Top K <input name="rag.top_k" type="number" /></label>
              <label>Chunk size <input name="rag.chunk_size" type="number" /></label>
              <label>Overlap <input name="rag.chunk_overlap" type="number" /></label>
            </fieldset>
            <button type="submit">Save Config</button>
          </form>
        </div>
      </aside>
      <main class="chat-main">
        <header class="chat-header">protoRAG Chat</header>
        <section id="messages" class="messages"></section>
        <footer class="chat-input">
          <textarea id="message-input" rows="3" placeholder="Ask a question about your documents..."></textarea>
          <button id="send-btn">Send</button>
        </footer>
      </main>
    </div>
    <script src="/static/js/app.js"></script>
  </body>
</html>
