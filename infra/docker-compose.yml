version: "3.9"

services:
  backend:
    build: ../backend
    working_dir: /app
    volumes:
      - ../backend:/app
      - ../data:/data
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    command: ["bash", "-lc", "source .venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build: ../frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ../qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
